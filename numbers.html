<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Numbers · Darija Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#282828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Darija">
</head>
<body>
<div class="wrap">
  <header id="top"></header>

  <div class="settings" id="numSettings">
    <div class="seg" role="group" aria-label="Direction" data-group="dir">
      <button type="button" data-val="en-ar">English → Darija</button>
      <button type="button" data-val="ar-en">Darija → English</button>
    </div>
    <div>
      <p class="lbl">Range (0 to 10,000)</p>
      <div class="range">
        <input type="range" id="loS" min="0" max="401" aria-label="Lowest number">
        <input type="number" id="loN" min="0" max="10000" inputmode="numeric" aria-label="Lowest number">
        <input type="range" id="hiS" min="0" max="401" aria-label="Highest number">
        <input type="number" id="hiN" min="0" max="10000" inputmode="numeric" aria-label="Highest number">
      </div>
    </div>
  </div>

  <div class="panel" id="quiz"></div>
</div>
<script type="module" src="assets/numbers.js"></script>
</body>
</html>
