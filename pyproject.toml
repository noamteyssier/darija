[project]
name = "darija"
version = "0.0.0"
description = "Static site for drilling Moroccan Arabic"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "playwright",
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.src]
include = ["tests"]
