<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match · Darija Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header id="top"></header>

  <div class="settings" id="matchSettings">
    <div class="seg" role="group" aria-label="Direction" data-group="dir">
      <button type="button" data-val="en-ar">English → Arabic</button>
      <button type="button" data-val="ar-en">Arabic → English</button>
    </div>
    <div>
      <p class="lbl">Choices</p>
      <div class="seg" role="group" aria-label="Number of choices" data-group="choices">
        <button type="button" data-val="3">3</button>
        <button type="button" data-val="4">4</button>
        <button type="button" data-val="5">5</button>
        <button type="button" data-val="6">6</button>
      </div>
    </div>
    <div>
      <p class="lbl">Verb set</p>
      <div class="chipset" id="levels" role="group" aria-label="Levels"></div>
    </div>
    <details class="more">
      <summary id="moreSummary">More filters</summary>
      <div class="settings">
        <div>
          <p class="lbl">Topics (none picked = all)</p>
          <div class="chipset" id="topics" role="group" aria-label="Topics"></div>
        </div>
        <p class="note">Star verbs in the <a href="dictionary.html">dictionary</a> to build your own set.</p>
      </div>
    </details>
  </div>

  <div class="panel" id="quiz"></div>
</div>
<script type="module" src="assets/match.js"></script>
</body>
</html>
