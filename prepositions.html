<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prepositions · Darija Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header id="top"></header>
  <p class="lead">Four modules for Darija prepositions. Stay on one until it feels easy, then move on.</p>
  <div class="modules" id="modules" role="group" aria-label="Modules"></div>
  <div class="card" id="intro"><div class="prose" id="introText"></div></div>
  <details class="more" id="pronBox">
    <summary id="pronSummary">Pronouns (7 of 7)</summary>
    <div class="settings">
      <div class="chipset" id="prons" role="group" aria-label="Pronouns"></div>
      <button class="btn ghost" type="button" id="pronAll">Select all</button>
    </div>
  </details>
  <div class="panel" id="quiz"></div>
</div>
<script type="module" src="assets/prepositions.js"></script>
</body>
</html>
